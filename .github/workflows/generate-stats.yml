name: Generate stats SVGs

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/generate_stats.py
      - .github/workflows/generate-stats.yml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.PROFILE_TOKEN != '' && '1' || '' }}
        run: python .github/scripts/generate_stats.py

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ public/stats/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh stats SVGs + JSON"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push attempt $i failed, retrying..."
              sleep $((i * 3))
            done
            echo "push failed after 5 attempts" && exit 1
          fi
